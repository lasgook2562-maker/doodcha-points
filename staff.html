<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dood Cha - พนักงานเพิ่มแต้ม</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --brown: #4a2f22;
    --cream: #f4ead9;
    --gold: #c79a4b;
    --green: #3f8f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif;
    background: var(--cream);
    color: var(--brown);
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: #fff;
    padding: 24px 20px 40px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 4px;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #8a7360;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #ddceb8;
    font-size: 16px;
  }
  .video-wrap {
    margin-top: 16px;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    display: none;
  }
  .video-wrap.active { display: block; }
  video { width: 100%; display: block; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 14px;
    cursor: pointer;
  }
  .btn-scan {
    background: var(--cream);
    color: var(--brown);
    border: 2px solid var(--gold);
  }
  .btn-submit {
    background: var(--brown);
    color: var(--cream);
  }
  .btn-submit:disabled {
    opacity: 0.5;
  }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-size: 15px;
    display: none;
  }
  .result.success {
    background: #e6f4ea;
    color: var(--green);
    display: block;
  }
  .result.error {
    background: #fdecea;
    color: #b3261e;
    display: block;
  }
</style>
</head>
<body>
  <div class="card" id="lockScreen">
    <h1>🔒 หน้าพนักงาน</h1>
    <p class="sub">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
    <input type="password" id="pwInput" placeholder="รหัสผ่าน" style="margin-top:8px;" />
    <button class="btn-submit" id="pwBtn" style="margin-top:14px;">เข้าสู่ระบบ</button>
    <div class="result" id="pwError"></div>
  </div>

  <div class="card" id="mainScreen" style="display:none;">
    <h1>เพิ่มแต้มลูกค้า</h1>
    <p class="sub">ร้าน Dood Cha</p>

    <label for="uidInput">รหัสลูกค้า (UID)</label>
    <input type="text" id="uidInput" placeholder="สแกน QR หรือพิมพ์รหัสลูกค้า" />

    <button class="btn-scan" id="scanBtn">📷 เปิดกล้องสแกน QR</button>
    <div class="video-wrap" id="videoWrap">
      <video id="video" playsinline autoplay muted></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <label for="pointsInput">จำนวนแต้มที่จะเพิ่ม</label>
    <input type="number" id="pointsInput" value="1" min="1" />

    <button class="btn-submit" id="submitBtn">✓ เพิ่มแต้ม</button>

    <div class="result" id="result"></div>
  </div>

<script>
  // ⚠️ ตั้งรหัสผ่านสำหรับพนักงานตรงนี้ (แก้เป็นรหัสที่ต้องการได้เลย)
  const STAFF_PASSWORD = "doodcha2026";

  const lockScreen = document.getElementById("lockScreen");
  const mainScreen = document.getElementById("mainScreen");
  const pwInput = document.getElementById("pwInput");
  const pwBtn = document.getElementById("pwBtn");
  const pwError = document.getElementById("pwError");

  // จำการล็อกอินไว้ในเครื่องนี้ 12 ชั่วโมง ไม่ต้องกรอกรหัสซ้ำทุกครั้ง
  const savedAuth = sessionStorage.getItem("staffAuth");
  if (savedAuth === "ok") {
    lockScreen.style.display = "none";
    mainScreen.style.display = "block";
  }

  function checkPassword() {
    if (pwInput.value === STAFF_PASSWORD) {
      sessionStorage.setItem("staffAuth", "ok");
      lockScreen.style.display = "none";
      mainScreen.style.display = "block";
    } else {
      pwError.textContent = "รหัสผ่านไม่ถูกต้อง";
      pwError.className = "result error";
    }
  }

  pwBtn.addEventListener("click", checkPassword);
  pwInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkPassword();
  });

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtbcvaoCQam2N5ynVj6Q4tVW1102EswQ4V-LeQNg_nmcpPOw7b52Dk7KVtgcd2Bg7v/exec";

  const uidInput = document.getElementById("uidInput");
  const pointsInput = document.getElementById("pointsInput");
  const submitBtn = document.getElementById("submitBtn");
  const scanBtn = document.getElementById("scanBtn");
  const videoWrap = document.getElementById("videoWrap");
  const video = document.getElementById("video");
  const resultBox = document.getElementById("result");

  let stream = null;
  let scanning = false;

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // สแกน QR ด้วยไลบรารี jsQR ผ่านการอ่านภาพจากกล้องทีละเฟรม (ทำงานได้ทุกเบราว์เซอร์)
  scanBtn.addEventListener("click", async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      video.srcObject = stream;
      videoWrap.classList.add("active");
      scanning = true;

      video.addEventListener("loadedmetadata", () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }, { once: true });

      const scanLoop = () => {
        if (!scanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            uidInput.value = code.data;
            stopScan();
            return;
          }
        }
        requestAnimationFrame(scanLoop);
      };
      scanLoop();
    } catch (err) {
      alert("เปิดกล้องไม่สำเร็จ: " + err.message);
    }
  });

  function stopScan() {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    videoWrap.classList.remove("active");
  }

  submitBtn.addEventListener("click", async () => {
    const userId = uidInput.value.trim();
    const points = Number(pointsInput.value);

    if (!userId) {
      showResult("กรุณากรอกหรือสแกนรหัสลูกค้าก่อน", false);
      return;
    }
    if (!points || points <= 0) {
      showResult("กรุณากรอกจำนวนแต้มให้ถูกต้อง", false);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "กำลังบันทึก...";

    try {
      const url = `${SCRIPT_URL}?action=addPoints&userId=${encodeURIComponent(userId)}&points=${points}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.success) {
        showResult(`เพิ่มแต้มสำเร็จ! แต้มสะสมล่าสุด: ${data.points}`, true);
        uidInput.value = "";
      } else {
        showResult("เกิดข้อผิดพลาด กรุณาลองใหม่", false);
      }
    } catch (err) {
      showResult("เชื่อมต่อไม่สำเร็จ: " + err.message, false);
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "✓ เพิ่มแต้ม";
  });

  function showResult(msg, ok) {
    resultBox.textContent = msg;
    resultBox.className = "result " + (ok ? "success" : "error");
  }
</script>
</body>
</html>
