<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dood Cha - สะสมแต้ม</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --brown: #4a2f22;
    --cream: #f4ead9;
    --gold: #c79a4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif;
    background: var(--cream);
    color: var(--brown);
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: #fff;
    padding: 24px 20px 40px;
  }
  .header {
    text-align: center;
    padding: 20px 0 10px;
  }
  .header img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
  }
  .header h1 {
    font-size: 20px;
    margin: 12px 0 2px;
  }
  .header p {
    color: #8a7360;
    font-size: 13px;
    margin: 0;
  }
  .points-box {
    background: linear-gradient(135deg, var(--brown), #6b4530);
    color: var(--cream);
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    margin: 20px 0;
  }
  .points-box .num {
    font-size: 42px;
    font-weight: 700;
    color: var(--gold);
  }
  .points-box .label {
    font-size: 13px;
    opacity: 0.85;
  }
  .qr-box {
    background: var(--cream);
    border: 2px dashed var(--gold);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }
  .qr-box canvas {
    max-width: 180px;
  }
  .qr-box p {
    font-size: 12px;
    color: #8a7360;
    margin-top: 10px;
  }
  .status {
    text-align: center;
    font-size: 14px;
    color: #8a7360;
    padding: 40px 0;
  }
  .uid {
    font-size: 10px;
    word-break: break-all;
    color: #b3a58f;
    text-align: center;
    margin-top: 4px;
  }
  .rewards-box h2 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  .reward-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1.5px solid #ead9bd;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .reward-name {
    font-size: 14px;
    font-weight: 600;
  }
  .reward-cost {
    font-size: 12px;
    color: #8a7360;
  }
  .redeem-btn {
    background: var(--gold);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .redeem-btn:disabled {
    opacity: 0.5;
  }
  .redeem-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 4px;
    min-height: 18px;
  }
  .redeem-msg.ok { color: #3f8f5f; }
  .redeem-msg.err { color: #b3261e; }
</style>
</head>
<body>
  <div class="card">
    <div id="loading" class="status">กำลังโหลด...</div>

    <div id="content" style="display:none;">
      <div class="header">
        <img id="profilePic" src="" alt="profile" />
        <h1 id="displayName">-</h1>
        <p>สมาชิกร้าน Dood Cha</p>
      </div>

      <div class="points-box">
        <div class="num" id="pointCount">0</div>
        <div class="label">แต้มสะสมของคุณ</div>
      </div>

      <div class="qr-box">
        <img id="qrcode" alt="QR code" style="width:180px;height:180px;" />
        <p>แสดง QR นี้ให้พนักงานสแกนทุกครั้งที่สั่งซื้อ</p>
        <div class="uid" id="uidText"></div>
      </div>

      <div class="rewards-box">
        <h2>แลกของรางวัล</h2>
        <div class="reward-item">
          <div>
            <div class="reward-name">เครื่องดื่มฟรี 1 แก้ว</div>
            <div class="reward-cost">ใช้ 10 แต้ม</div>
          </div>
          <button class="redeem-btn" data-cost="10" data-name="เครื่องดื่มฟรี 1 แก้ว">แลก</button>
        </div>
      </div>

      <div class="redeem-msg" id="redeemMsg"></div>
    </div>
  </div>

<script>
  // ⚠️ ใส่ LIFF ID ที่ได้จาก LINE Developers Console ตรงนี้
  const LIFF_ID = "2011602503-cfZspRj0";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtbcvaoCQam2N5ynVj6Q4tVW1102EswQ4V-LeQNg_nmcpPOw7b52Dk7KVtgcd2Bg7v/exec";

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();

      document.getElementById("profilePic").src = profile.pictureUrl || "";
      document.getElementById("displayName").textContent = profile.displayName;
      document.getElementById("uidText").textContent = profile.userId;

      // ดึงแต้มจริงจาก Google Sheets ผ่าน Apps Script API
      const res = await fetch(
        `${SCRIPT_URL}?userId=${encodeURIComponent(profile.userId)}`
      );
      const pointData = await res.json();
      document.getElementById("pointCount").textContent = pointData.points;

      // สร้าง QR code จาก userId เพื่อให้พนักงานสแกนตอนเพิ่มแต้ม
      document.getElementById("qrcode").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
        encodeURIComponent(profile.userId);

      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

      // ผูกปุ่มแลกรางวัลทุกปุ่ม
      document.querySelectorAll(".redeem-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const cost = btn.dataset.cost;
          const rewardName = btn.dataset.name;
          btn.disabled = true;
          const msgBox = document.getElementById("redeemMsg");
          msgBox.textContent = "กำลังดำเนินการ...";
          msgBox.className = "redeem-msg";

          try {
            const r = await fetch(
              `${SCRIPT_URL}?action=redeem&userId=${encodeURIComponent(profile.userId)}&cost=${cost}`
            );
            const d = await r.json();
            if (d.success) {
              document.getElementById("pointCount").textContent = d.points;
              msgBox.textContent = `แลก "${rewardName}" สำเร็จ! แสดงข้อความนี้ให้พนักงานดู`;
              msgBox.className = "redeem-msg ok";
            } else {
              msgBox.textContent = d.error || "แลกไม่สำเร็จ";
              msgBox.className = "redeem-msg err";
            }
          } catch (err) {
            msgBox.textContent = "เชื่อมต่อไม่สำเร็จ: " + err.message;
            msgBox.className = "redeem-msg err";
          }
          btn.disabled = false;
        });
      });
    } catch (err) {
      document.getElementById("loading").textContent =
        "เกิดข้อผิดพลาด: " + err.message;
    }
  }

  main();
</script>
</body>
</html>
